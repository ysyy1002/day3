<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #map { height: calc(100vh - 90px); }
        #note { font-size: 12px; color: #666; padding: 0 10px 6px; }
    </style>
</head>
<body>
    <div id="bar">
        <label>지역
            <select id="area">
                <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
            </select>
        </label>
        <label>구분
            <select id="indoor">
                <option value="">전체</option><option value="true">실내</option><option value="false">야외</option>
            </select>
        </label>
        <button id="go">찾기</button>
        <span id="msg"></span>
    </div>
    <div id="note">※ 목록에 좌표가 없어, 마커는 각 지역 중심 근처에 흩어 찍은 대략적인 위치입니다.</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 목록의 area(읍면 포함) → 대략적인 중심 좌표 [위도, 경도]
        const CENTER = {
            "동쪽(성산)": [33.45, 126.92], "동쪽(구좌)": [33.52, 126.85],
            "서쪽(한림)": [33.40, 126.27], "서쪽(안덕)": [33.28, 126.33],
            "제주시": [33.50, 126.53], "서귀포": [33.26, 126.56],
        }
        const MAX_RESULTS = 8
        let spots = []

        // api/tools.js 의 find_spots 와 같은 조건 (브라우저에서는 node:fs 를 못 쓰므로 fetch 로 읽음)
        const find_spots = ({ area, indoor }) =>
            spots
                .filter(s => s.area === area || s.area.startsWith(area + "("))
                .filter(s => indoor === undefined || s.indoor === indoor)
                .slice(0, MAX_RESULTS)

        // 같은 지역 장소가 한 점에 겹치지 않도록 이름으로 만든 값으로 조금씩 흩뜨림
        const place = (s) => {
            let h = 0
            for (const ch of s.name) h = (h * 31 + ch.charCodeAt(0)) % 1000
            const [lat, lon] = CENTER[s.area]
            return [lat + (h % 10 - 4.5) * 0.008, lon + (Math.floor(h / 10) % 10 - 4.5) * 0.008]
        }

        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        document.getElementById("go").onclick = () => {
            const v = document.getElementById("indoor").value
            const found = find_spots({
                area: document.getElementById("area").value,
                indoor: v === "" ? undefined : v === "true",
            })
            layer.clearLayers()
            for (const s of found) {
                L.marker(place(s)).addTo(layer)
                    .bindPopup("<b>" + s.name + "</b><br>" + s.area + " · " + (s.indoor ? "실내" : "야외") + "<br>" + s.type)
            }
            document.getElementById("msg").textContent = found.length + "곳"
            if (found.length) map.fitBounds(L.latLngBounds(found.map(place)).pad(0.3))
        }

        fetch("jeju_spots.json").then(r => r.json()).then(d => {
            spots = d.spots
            document.getElementById("go").click()
        })
    </script>
</body>
</html>
