<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 전 세계 지진 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
        #bar { padding: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        #bar b { font-size: 18px; }
        #wrap { display: flex; height: calc(100vh - 56px); }
        #map { flex: 1; }
        #list { width: 280px; overflow-y: auto; font-size: 13px; }
        #list div { padding: 8px 10px; border-bottom: 1px solid #333; cursor: pointer; }
        #list div:hover { background: #222; }
        .mag { font-weight: bold; }
        .pulse { animation: pulse 1.4s ease-out infinite; }
        @keyframes pulse { 0% { opacity: .9; } 100% { opacity: .15; } }
        @media (max-width: 700px) { #wrap { flex-direction: column; } #list { width: auto; height: 35%; } }
    </style>
</head>
<body>
    <div id="bar">
        <b>🌍 실시간 지진</b>
        <label>기간
            <select id="feed">
                <option value="all_hour">최근 1시간</option>
                <option value="all_day" selected>최근 24시간</option>
                <option value="2.5_week">최근 7일 (규모 2.5+)</option>
                <option value="4.5_week">최근 7일 (규모 4.5+)</option>
            </select>
        </label>
        <span id="msg">불러오는 중…</span>
    </div>
    <div id="wrap">
        <div id="map"></div>
        <div id="list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // USGS 지진 피드 (API 키 불필요)
        const URL_BASE = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/"

        const map = L.map("map", { worldCopyJump: true }).setView([20, 130], 3)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors | 데이터: USGS",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        // 규모가 클수록 크고 붉게
        const color = (m) => m >= 6 ? "#ff1744" : m >= 5 ? "#ff6d00" : m >= 4 ? "#ffc400" : m >= 3 ? "#c6ff00" : "#69f0ae"
        const radius = (m) => Math.max(3, m * m * 1.6)
        const ago = (t) => {
            const min = Math.round((Date.now() - t) / 60000)
            return min < 60 ? min + "분 전" : min < 1440 ? Math.round(min / 60) + "시간 전" : Math.round(min / 1440) + "일 전"
        }

        const load = () => {
            fetch(URL_BASE + document.getElementById("feed").value + ".geojson")
                .then(r => r.json())
                .then(d => {
                    layer.clearLayers()
                    const list = document.getElementById("list")
                    list.innerHTML = ""
                    const now = Date.now()
                    // 강한 지진부터 목록에 표시
                    const sorted = d.features.filter(f => f.properties.mag != null)
                        .sort((a, b) => b.properties.mag - a.properties.mag)
                    for (const f of sorted) {
                        const p = f.properties
                        const [lon, lat, depth] = f.geometry.coordinates
                        const fresh = now - p.time < 3600000   // 1시간 이내는 깜빡임
                        const c = L.circleMarker([lat, lon], {
                            radius: radius(p.mag), color: color(p.mag), fillColor: color(p.mag),
                            fillOpacity: 0.45, weight: 1, className: fresh ? "pulse" : "",
                        }).addTo(layer)
                        c.bindPopup("<b>M " + p.mag.toFixed(1) + "</b> " + p.place + "<br>" + ago(p.time) +
                            " · 깊이 " + Math.round(depth) + "km<br><a href='" + p.url + "' target='_blank'>USGS 상세</a>")
                        if (list.children.length < 50) {
                            const row = document.createElement("div")
                            row.innerHTML = "<span class='mag' style='color:" + color(p.mag) + "'>M " + p.mag.toFixed(1) +
                                "</span> " + p.place + "<br><small>" + ago(p.time) + "</small>"
                            row.onclick = () => { map.setView([lat, lon], 6); c.openPopup() }
                            list.appendChild(row)
                        }
                    }
                    document.getElementById("msg").textContent = "총 " + sorted.length + "건 · 1분마다 자동 갱신"
                })
                .catch(() => document.getElementById("msg").textContent = "데이터를 불러오지 못했습니다.")
        }

        document.getElementById("feed").onchange = load
        load()
        setInterval(load, 60000)
    </script>
</body>
</html>
