<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 날씨 맞춤 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #wrap { display: flex; height: 100vh; }
        #chat { width: 380px; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
        #log { flex: 1; overflow-y: auto; padding: 10px; }
        .me { background: #e3f2fd; padding: 8px 10px; border-radius: 8px; margin: 6px 0 6px 40px; }
        .bot { background: #f5f5f5; padding: 8px 10px; border-radius: 8px; margin: 6px 40px 6px 0; white-space: pre-wrap; }
        .step { font-size: 12px; color: #666; margin: 2px 0 2px 4px; }
        #form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #ddd; }
        #q { flex: 1; padding: 8px; }
        #map { flex: 1; }
        #note { font-size: 11px; color: #888; padding: 0 10px 8px; }
        @media (max-width: 700px) { #wrap { flex-direction: column-reverse; } #chat { width: auto; height: 55%; } }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="chat">
            <div id="log">
                <div class="bot">제주 여행을 물어보세요. 날씨와 장소 목록을 직접 확인해 추천해 드려요.
예) 내일 서귀포에서 가기 좋은 곳 알려줘</div>
            </div>
            <div id="note">※ 지도 마커는 목록에 좌표가 없어 각 지역 중심 근처에 흩어 찍은 대략적인 위치입니다.</div>
            <form id="form">
                <input id="q" placeholder="무엇이든 물어보세요" autocomplete="off">
                <button id="send">보내기</button>
            </form>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CENTER = {
            "동쪽(성산)": [33.45, 126.92], "동쪽(구좌)": [33.52, 126.85],
            "서쪽(한림)": [33.40, 126.27], "서쪽(안덕)": [33.28, 126.33],
            "제주시": [33.50, 126.53], "서귀포": [33.26, 126.56],
        }
        const TOOL_NAME = { find_spots: "🗺️ 장소 검색", get_weather: "☀️ 날씨 조회" }

        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors | 날씨: Open-Meteo",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        // 같은 지역 장소가 한 점에 겹치지 않도록 이름으로 만든 값으로 조금씩 흩뜨림
        const place = (s) => {
            let h = 0
            for (const ch of s.name) h = (h * 31 + ch.charCodeAt(0)) % 1000
            const [lat, lon] = CENTER[s.areas[0]]
            return [lat + (h % 10 - 4.5) * 0.008, lon + (Math.floor(h / 10) % 10 - 4.5) * 0.008]
        }

        const log = document.getElementById("log")
        const add = (cls, text) => {
            const el = document.createElement("div")
            el.className = cls
            el.textContent = text
            log.appendChild(el)
            log.scrollTop = log.scrollHeight
            return el
        }

        document.getElementById("form").onsubmit = async (e) => {
            e.preventDefault()
            const q = document.getElementById("q")
            const message = q.value.trim()
            if (!message) return
            q.value = ""
            add("me", message)
            const wait = add("step", "생각하는 중…")
            document.getElementById("send").disabled = true
            try {
                const r = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message }),
                })
                const d = await r.json()
                wait.remove()
                if (d.error) { add("bot", "오류: " + d.error); return }
                for (const s of d.steps) add("step", (TOOL_NAME[s.tool] || s.tool) + " " + JSON.stringify(s.input))
                add("bot", d.reply)

                layer.clearLayers()
                for (const s of d.spots) {
                    L.marker(place(s)).addTo(layer)
                        .bindPopup("<b>" + s.name + "</b><br>" + s.areas[0] + " · " + (s.indoor ? "실내" : "야외") + "<br>" + s.description)
                }
                if (d.spots.length) map.fitBounds(L.latLngBounds(d.spots.map(place)).pad(0.3))
            } catch (err) {
                wait.remove()
                add("bot", "요청에 실패했어요: " + err.message)
            } finally {
                document.getElementById("send").disabled = false
            }
        }
    </script>
</body>
</html>
